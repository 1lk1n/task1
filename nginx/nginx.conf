events {}

http {
    # Docker's DNS. Upstreams are resolved per request (they're variables), so nginx sees every replica
    # of a service, including ones started or restarted after nginx, and balances between them.
    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 20m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    server {
        listen 80;

        set $web http://web:3000;
        set $api http://api:8000;
        set $bot http://bot:8080;
        set $minio http://minio:9000;

        # Catalog API
        location /api/ {
            proxy_pass $api;
        }

        # Telegram webhook (Telegram -> one of the bot replicas)
        location /bot/ {
            proxy_pass $bot;
        }

        # Product images: read-only access to the public bucket in MinIO
        location /media/ {
            limit_except GET HEAD { deny all; }
            rewrite ^/media/(.*)$ /products/$1 break;
            proxy_set_header Host minio:9000;
            proxy_pass $minio;
        }

        # Next.js catalog (the Telegram Mini App opens this page)
        location / {
            proxy_pass $web;
        }
    }
}
